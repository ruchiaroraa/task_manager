<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager Application</title>

    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/dark-theme.css">
</head>

<body>

    
    <header>
        <h1>Task Manager</h1>
        <button id="themeToggle">Toggle Theme</button>
    </header>


    <section class="task-form-section">

        <h2>Create Task</h2>

        <form id="taskForm">

            <input
                type="text"
                id="taskInput"
                value="Default Task"
                placeholder="Enter Task">

            <select id="category">

                <option value="Work">Work</option>
                <option value="Study">Study</option>
                <option value="Personal">Personal</option>

            </select>

            <button type="submit">
                Add Task
            </button>

        </form>


    </section>


    <section class="filters">

        <input
            type="text"
            id="searchTask"
            placeholder="Search Task">

        <select id="filterCategory">

            <option value="all">All Categories</option>
            <option value="Work">Work</option>
            <option value="Study">Study</option>
            <option value="Personal">Personal</option>

        </select>

        <button id="clearAll">
            Clear All Tasks
        </button>

    </section>


    <section class="stats">

        <div>Total Tasks: <span id="totalTasks">0</span></div>

        <div>Completed: <span id="completedTasks">0</span></div>

        <div>Pending: <span id="pendingTasks">0</span></div>

    </section>


    <section>

        <h2>Tasks</h2>

        <div id="taskContainer"></div>

    </section>


    <section class="propagation">

        <h2>Event Propagation Demo</h2>

        <div id="grandparent">

            Grandparent

            <div id="parent">

                Parent

                <button id="childBtn">
                    Child Button
                </button>

            </div>

        </div>

    </section>


    <section>

        <h2>Browser Rendering Pipeline</h2>

        <div class="pipeline">

            <div class="card">HTML</div>
            <div class="arrow">↓</div>

            <div class="card">Parsing</div>
            <div class="arrow">↓</div>

            <div class="card">Tokenization</div>
            <div class="arrow">↓</div>

            <div class="card">DOM Tree</div>
            <div class="arrow">↓</div>

            <div class="card">CSSOM Tree</div>
            <div class="arrow">↓</div>

            <div class="card">Render Tree</div>

        </div>

    </section>

    <script src="./js/storage.js"></script>
    <script src="./js/tasks.js"></script>
    <script src="./js/theme.js"></script>
    <script src="./js/propagation.js"></script>
    <script src="./js/rendering.js"></script>
    <script src="./js/app.js"></script>

</body>
</html>
